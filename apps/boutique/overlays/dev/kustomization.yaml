# Dev: Online Boutique in boutique-dev, without synthetic traffic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false

images:
  # The frontend. Until the first release it is the upstream image. Then the release workflow
  # sets dev to the image built from src/frontend, and the promote workflow copies dev's image
  # to prod. Both use scripts/Set-FrontendImage.ps1, which rewrites only this entry (DECISIONS #23).
  - name: us-central1-docker.pkg.dev/online-boutique-ci/microservices-demo/frontend
    newName: ghcr.io/kaushik-sai/gitops-platform/frontend
    digest: sha256:32130302fefc2ca7845f4fb855f2cb017b810849839764614a30eb57c5e37bdb

patches:
  # No load generator in dev: nothing reads dev's traffic, and it saves memory (DECISIONS #10).
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
