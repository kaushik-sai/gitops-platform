# Dev: Online Boutique in boutique-dev, without synthetic traffic.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: boutique-dev

resources:
  - ../../base

labels:
  - pairs:
      environment: dev
    includeSelectors: false

patches:
  # No load generator in dev: nothing reads dev's traffic, and it saves memory (DECISIONS #10).
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: loadgenerator
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: loadgenerator
