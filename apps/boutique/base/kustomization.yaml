# Online Boutique, shared by every environment. The overlays set the namespace and the differences.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Upstream release v0.10.7, vendored unchanged: see upstream/README.md.
  - upstream/kubernetes-manifests.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: online-boutique
    # Selectors stay as upstream wrote them.
    includeSelectors: false

patches:
  # kind has no load balancer: this Service would stay Pending and Argo CD would report
  # the app as Progressing forever. The frontend is reached with kubectl port-forward.
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: frontend-external
