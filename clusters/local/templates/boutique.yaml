{{- range .Values.environments }}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-{{ . }}
  namespace: argocd
  # Deleting the Application also deletes what it deployed.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    # Quoted: a revision such as 1234567 (a short SHA) or 1.10 (a tag) would otherwise be a number.
    repoURL: {{ $.Values.repoURL | quote }}
    targetRevision: {{ $.Values.targetRevision | quote }}
    path: apps/boutique/overlays/{{ . }}
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique-{{ . }}
  # Git is the only way to change the cluster: drift is reverted, removed files are pruned.
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
{{- end }}
